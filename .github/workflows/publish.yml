name: publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned (not ubuntu-latest) so the glibc floor this produces
          # doesn't silently shift whenever GitHub bumps their default image.
          - os: ubuntu-22.04
            platform: linux-x64
            jai: jai-linux
            lld: lld-linux
            binary: pulgar
          - os: macos-14
            platform: darwin-arm64
            jai: jai-macos
            lld: lld-macos
            binary: pulgar
          # windows not set up yet
          # - os: windows-latest
          #   platform: win32-x64
          #   jai: jai.exe
          #   lld: lld.exe
          #   binary: pulgar.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install build deps (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang

      - name: install build deps (macos)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: fetch jai + lld
        env:
          GH_TOKEN: ${{ secrets.JAI_TOOLCHAIN_TOKEN }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/jai"
          gh release download v1 \
            --repo gabrielmfern/jai-toolchain \
            --pattern "${{ matrix.jai }}" --pattern "${{ matrix.lld }}" \
            --dir "$RUNNER_TEMP/jai" \
            --clobber
          chmod +x "$RUNNER_TEMP/jai/${{ matrix.jai }}" "$RUNNER_TEMP/jai/${{ matrix.lld }}" || true
          echo "$RUNNER_TEMP/jai" >> "$GITHUB_PATH"

      - name: get vendor/node commit
        id: submodule
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:vendor/node)" >> "$GITHUB_OUTPUT"

      - name: cache node build
        id: node-cache
        uses: actions/cache@v4
        with:
          path: vendor/node/out
          key: node-build-${{ matrix.os }}-${{ steps.submodule.outputs.sha }}

      # Node's own build system: ninja on Linux/macOS, MSVC via vcbuild.bat on Windows.
      # Not yet verified end to end on macOS/Windows in CI - the recipe mirrors the
      # documented/known-working Linux one and build.jai's own vcbuild.bat comment.
      - name: build libnode (linux/macos)
        if: steps.node-cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        working-directory: vendor/node
        run: |
          ./configure --shared --ninja
          ninja -C out/Release

      - name: build libnode (windows)
        if: steps.node-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        working-directory: vendor/node
        shell: cmd
        run: vcbuild.bat dll

      # Builds optimized and writes dist/<platform>/package.json for the
      # @pulgar/<platform> package - see publish.jai. Every run builds and
      # tests this exact artifact; only workflow_dispatch goes on to publish it.
      - name: build + package
        shell: bash
        run: ${{ matrix.jai }} publish.jai

      - name: install test deps
        working-directory: tests
        run: npm ci

      - name: run tests
        shell: bash
        run: ./dist/${{ matrix.platform }}/${{ matrix.binary }} ./tests

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}/

  publish-platform-packages:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        platform: [linux-x64, darwin-arm64] # win32-x64 not set up yet
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: npm-publish
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pkg-${{ matrix.platform }}
          path: pkg
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm publish --access public
        working-directory: pkg

  publish-root-package:
    needs: publish-platform-packages
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm publish --access public
