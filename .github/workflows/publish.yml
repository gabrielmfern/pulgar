name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned (not ubuntu-latest) so the glibc floor this produces
          # doesn't silently shift whenever GitHub bumps their default image.
          - os: ubuntu-22.04
            platform: linux-x64
            jai: jai-linux
            lld: lld-linux
            binary: pulgar
          - os: macos-14
            platform: darwin-arm64
            jai: jai-macos
            lld: lld-macos
            binary: pulgar
          - os: windows-latest
            platform: win32-x64
            jai: jai.exe
            lld: lld.exe
            binary: pulgar.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install build deps (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang

      - name: install build deps (macos)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: use newest available xcode
        if: runner.os == 'macOS'
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          clang --version

      - name: fetch jai + lld + modules
        env:
          GH_TOKEN: ${{ secrets.JAI_TOOLCHAIN_TOKEN }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/jai/bin"
          gh release download v1 \
            --repo gabrielmfern/jai-toolchain \
            --pattern "${{ matrix.jai }}" --pattern "${{ matrix.lld }}" --pattern modules.tar.gz \
            --dir "$RUNNER_TEMP/jai/bin" \
            --clobber
          if [ "$RUNNER_OS" = Windows ]; then exclude="--exclude=*/linux/*"; fi
          (cd "$RUNNER_TEMP/jai" && tar -xzf bin/modules.tar.gz $exclude)
          chmod +x "$RUNNER_TEMP/jai/bin/${{ matrix.jai }}" "$RUNNER_TEMP/jai/bin/${{ matrix.lld }}" || true
          echo "$RUNNER_TEMP/jai/bin" >> "$GITHUB_PATH"

      - name: get vendor/node commit
        id: submodule
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:vendor/node)" >> "$GITHUB_OUTPUT"

      - name: restore node build
        id: node-cache
        uses: actions/cache/restore@v4
        with:
          path: vendor/node/out
          key: node-build-${{ matrix.os }}-${{ steps.submodule.outputs.sha }}

      # Node's own build system: ninja on Linux/macOS, MSVC via vcbuild.bat on Windows.
      # Not yet verified end to end on macOS/Windows in CI - the recipe mirrors the
      # documented/known-working Linux one and build.jai's own vcbuild.bat comment.
      - name: build libnode (linux/macos)
        if: steps.node-cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        working-directory: vendor/node
        run: |
          if [ "$RUNNER_OS" = Linux ]; then export CC=gcc-12 CXX=g++-12; fi
          ./configure --shared --ninja
          ninja -C out/Release

      - name: build libnode (windows)
        if: steps.node-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        working-directory: vendor/node
        shell: cmd
        run: vcbuild.bat dll

      - name: save node build
        if: steps.node-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vendor/node/out
          key: ${{ steps.node-cache.outputs.cache-primary-key }}

      # Builds optimized and writes dist/<platform>/package.json for the
      # @pulgar/<platform> package - see build.jai. Every run builds this exact
      # artifact; only a v* tag push or a manual run goes on to publish it.
      - name: build + package
        shell: bash
        run: ${{ matrix.jai }} build.jai -optimized - publish

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}/

  publish:
    needs: build
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          # full history + tags, so the release notes can diff against the previous tag
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: pkg
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: |
          for dir in pkg/pkg-*; do
            chmod +x "$dir"/pulgar*
            npm publish --access public "./$dir"
          done
      - run: npm publish --access public
      - if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # previous v* tag reachable from this one; empty on the first release, which then lists everything
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo "## Commits"
            echo
            git log --no-merges --pretty=format:'- %s (%h)' "${prev:+$prev..}$GITHUB_REF_NAME"
            echo
            if [ -n "$prev" ]; then
              echo
              echo "**Full Changelog**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_REF_NAME"
            fi
          } > notes.md
          for dir in pkg/pkg-*; do
            platform=${dir#pkg/pkg-}
            files=$(jq -r '.files[]' "$dir/package.json")
            if [ "$platform" = win32-x64 ]; then
              (cd "$dir" && zip "$GITHUB_WORKSPACE/pulgar-$platform.zip" $files)
            else
              tar -czf "pulgar-$platform.tar.gz" -C "$dir" $files
            fi
          done
          gh release create "$GITHUB_REF_NAME" --notes-file notes.md pulgar-*.tar.gz pulgar-*.zip
